# Builds and tests the site exactly as the Taskfile does locally. The build
# reads six source repositories and enhancements, checked out beside opmodel.dev as they sit in
# the workspace, so OPM_WS (the parent of the opmodel.dev checkout) is
# $GITHUB_WORKSPACE. README.md "CI" names the local equivalents.
name: Site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly. v1.0 is a line version (site/versions.conf), resolved again on
    # every build, so the nightly run of main publishes what moved upstream:
    # new releases (cli, and the library, core and opm-operator releases a
    # cli release pins; catalog_opm opm-v4.* tags), opm main, and the main or
    # release-branch heads of cli, library, opm-operator, core and catalog_opm
    # while their docs rule reads them. The sources-main job checks every source
    # repository's main in explicit mode (lint, build checks, links) and
    # publishes nothing. No source repository dispatches here; gh workflow
    # run Site --ref main publishes at once. An off-the-hour minute, because
    # GitHub delays runs at the top of the hour.
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # A page without a git date fails the build. Dates are computed on the host
  # by versions:prepare (materialise.sh), where git can read every source, so
  # a real build's container runs no git. CI can require them because every
  # source is a full clone (fetch-depth: 0), so every page has history. Locally
  # a page that is not committed yet has no date, so a local build leaves this
  # off.
  OPM_REQUIRE_DATES: '1'
  # The interim GitHub Pages site, until the Cloudflare deploy replaces it
  # (README.md, "GitHub Pages (interim)"). Never name it OPM_BASE_URL here:
  # every task build of the run, task ci's included, would build for this
  # path.
  PAGES_BASE_URL: https://open-platform-model.github.io/opmodel.dev/

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Concurrency is per job, one group per job, never workflow-level: a
    # workflow-level group would cancel a deploy job along with the rest of a
    # run, and two jobs sharing one cancelling group cancel each other. A
    # deploy job sets its own group without cancel-in-progress.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    # The working directory is a per-job default, never workflow-level: a
    # deploy job runs a step before its checkout, when opmodel.dev does not
    # exist yet. Action steps ignore it; their paths stay relative to
    # $GITHUB_WORKSPACE.
    defaults:
      run:
        working-directory: opmodel.dev
    steps:
      - name: Check out opmodel.dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: opmodel.dev
          fetch-depth: 0
          persist-credentials: false
      - name: Check out opm
        # fetch-depth: 0 brings every tag and every branch, the branches as
        # refs/remotes/origin/*, into each source checkout: the version
        # resolver reads them for a line version (the newest tag of a line,
        # origin/main, release/*) and refuses a shallow checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/opm
          ref: main
          path: opm
          fetch-depth: 0
          persist-credentials: false
      - name: Check out core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/core
          ref: main
          path: core
          fetch-depth: 0
          persist-credentials: false
      - name: Check out catalog_opm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/catalog_opm
          ref: main
          path: catalog_opm
          fetch-depth: 0
          persist-credentials: false
      - name: Check out cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/cli
          ref: main
          path: cli
          fetch-depth: 0
          persist-credentials: false
      - name: Check out library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/library
          ref: main
          path: library
          fetch-depth: 0
          persist-credentials: false
      - name: Check out opm-operator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/opm-operator
          ref: main
          path: opm-operator
          fetch-depth: 0
          persist-credentials: false
      - name: Check out enhancements
        # The design record, the unversioned Enhancements section: the
        # resolver reads its origin/main (site/versions.conf).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/enhancements
          ref: main
          path: enhancements
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Install openspec
        run: npm install -g @fission-ai/openspec@1.12.0

      - name: Lint the workflows
        run: task ci:lint
      - name: Pull the docs bundles
        # The Catalogs tab's signed docs bundles (site/bundles.cue): opm-docs
        # in the build image resolves, verifies and unpacks them into
        # site/.bundles/ with lock.json. Anonymous: the packages are public,
        # so no token and no permission. task build never pulls.
        run: task bundles:pull
      - name: Check, build and test the site
        run: task ci
      - name: The build leaves the tree clean
        # A build step may write a file that is not gitignored; it shows up
        # here. .task/ holds Task's checksum files.
        run: |
          dirty=$(git status --porcelain --untracked-files=all -- . ':(exclude).task')
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty"
            echo "task ci left the tree dirty; run task ci, then git status --porcelain, and commit or ignore these paths" >&2
            exit 1
          fi
      - name: Summary
        # Every version's resolved refs: the ref the stamp names, where its
        # docs tree came from, the commit built and the rule that chose it
        # (not the checkout heads, which a line version does not read).
        run: |
          {
            echo '### Site build'
            echo
            echo '| Version | Repository | Ref | Docs from | Commit | Rule |'
            echo '|---|---|---|---|---|---|'
            jq -r '.versions | to_entries[] | .key as $v | .value.refs | to_entries[]
              | "| \($v) | \(.key) | \(.value.ref) | \(.value.docs // "") | [\(.value.sha[0:12])](https://github.com/open-platform-model/\(.key)/commit/\(.value.sha)) | \(.value.how) |"' site/public/build-stamp.json
            jq -r '.sections // {} | to_entries[] | select(.value.ref)
              | "| (unversioned) | \(.key) | \(.value.ref) | | [\(.value.sha[0:12])](https://github.com/open-platform-model/\(.key)/commit/\(.value.sha)) | \(.value.how) |"' site/public/build-stamp.json
            if jq -e '.sections.catalogs' site/public/build-stamp.json >/dev/null; then
              echo
              echo '### Catalogs'
              echo
              echo '| Project | Segment | Version | Revision | Digest | Commit |'
              echo '|---|---|---|---|---|---|'
              jq -r '.sections.catalogs.bundles[]
                | "| \(.project) | \(.segment) | \(.version) | \(.revision) | \(if .local then "local" else .digest[0:19] end) | \(.commit[0:12]) |"' site/public/build-stamp.json
            fi
            echo
            echo "Files in site/public: $(find site/public -type f | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-public
          path: opmodel.dev/site/public
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-stamp
          path: opmodel.dev/site/public/build-stamp.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload the frozen manifest
        # The build as an anchored manifest at the refs it resolved: check out
        # opmodel.dev at the commit it names, copy it outside site/.versions/
        # and run OPM_VERSIONS_MANIFEST=<the copy> task build to rebuild the
        # same trees. Not on pull requests: their run builds GitHub's
        # temporary merge commit, which the header would name and which goes
        # away. Its own artifact, so build-stamp.json stays at the root of
        # build-stamp; include-hidden-files, because upload-artifact skips
        # paths under a dot directory such as .versions. It also holds the
        # docs bundles' lock, .bundles/lock.json beside .versions/frozen.conf:
        # copied to site/bundles.frozen.json, it pins task bundles:pull to the
        # digests this build read (README, "The Catalogs section").
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-manifest
          path: |
            opmodel.dev/site/.versions/frozen.conf
            opmodel.dev/site/.bundles/lock.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Build for GitHub Pages (interim)
        # The same sources, dates and checks, for the project site's path, into
        # site/public/ after every step that reads the default build has run.
        # It runs on pull requests too, so a change that breaks the path fails
        # there.
        env:
          OPM_BASE_URL: ${{ env.PAGES_BASE_URL }}
        run: |
          task build
          echo "GitHub Pages build for $OPM_BASE_URL: $(find site/public -type f | wc -l) files" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the GitHub Pages artifact
        # Every event, so a pull request proves the tar and upload of the real
        # Pages tree. Only pages-deploy is limited to main. It expires in a day.
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: opmodel.dev/site/public

  browser:
    name: Browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-browser
      cancel-in-progress: true
    defaults:
      run:
        working-directory: opmodel.dev
    # task qa builds site/public itself and that build reads all six source
    # roots and enhancements, so this job runs beside build with the same eight checkouts
    # instead of downloading the site-public artifact.
    steps:
      - name: Check out opmodel.dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: opmodel.dev
          fetch-depth: 0
          persist-credentials: false
      - name: Check out opm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/opm
          ref: main
          path: opm
          fetch-depth: 0
          persist-credentials: false
      - name: Check out core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/core
          ref: main
          path: core
          fetch-depth: 0
          persist-credentials: false
      - name: Check out catalog_opm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/catalog_opm
          ref: main
          path: catalog_opm
          fetch-depth: 0
          persist-credentials: false
      - name: Check out cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/cli
          ref: main
          path: cli
          fetch-depth: 0
          persist-credentials: false
      - name: Check out library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/library
          ref: main
          path: library
          fetch-depth: 0
          persist-credentials: false
      - name: Check out opm-operator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/opm-operator
          ref: main
          path: opm-operator
          fetch-depth: 0
          persist-credentials: false
      - name: Check out enhancements
        # The design record, the unversioned Enhancements section: the
        # resolver reads its origin/main (site/versions.conf).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/enhancements
          ref: main
          path: enhancements
          fetch-depth: 0
          persist-credentials: false

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Pull the docs bundles
        # The Catalogs tab's signed docs bundles (site/bundles.cue): opm-docs
        # in the build image resolves, verifies and unpacks them into
        # site/.bundles/ with lock.json. Anonymous: the packages are public,
        # so no token and no permission. task build never pulls.
        run: task bundles:pull
      - name: Screenshots, accessibility and search smoke tests
        run: task qa
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # The screenshots are the only way to see why an accessibility or
        # search test failed in CI, so they upload from failed runs too.
        # upload-artifact skips every file under a directory whose name starts
        # with a dot, so without include-hidden-files .shots uploads nothing.
        if: always()
        with:
          name: site-shots
          path: opmodel.dev/site/.shots
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # The source pages on every source repository's main, which the published
  # line version no longer reads for cli, library and opm-operator: an
  # explicit-mode build (OPM_VERSIONS=v1.0=/src) runs the source lint, every
  # build check and the link crawl over the main checkouts, so a page broken
  # on main fails here before it is tagged. It uploads nothing and
  # pages-deploy does not need it, so it cannot change what is published.
  # Dates are not its subject: shallow checkouts, OPM_REQUIRE_DATES off.
  sources-main:
    name: Source pages on main (not published)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-sources-main
      cancel-in-progress: true
    defaults:
      run:
        working-directory: opmodel.dev
    steps:
      - name: Check out opmodel.dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: opmodel.dev
          persist-credentials: false
      - name: Check out opm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/opm
          ref: main
          path: opm
          persist-credentials: false
      - name: Check out core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/core
          ref: main
          path: core
          persist-credentials: false
      - name: Check out catalog_opm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/catalog_opm
          ref: main
          path: catalog_opm
          persist-credentials: false
      - name: Check out cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/cli
          ref: main
          path: cli
          persist-credentials: false
      - name: Check out library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/library
          ref: main
          path: library
          persist-credentials: false
      - name: Check out opm-operator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/opm-operator
          ref: main
          path: opm-operator
          persist-credentials: false
      - name: Check out enhancements
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/enhancements
          ref: main
          path: enhancements
          persist-credentials: false

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Pull the docs bundles
        # The Catalogs tab's signed docs bundles (site/bundles.cue): opm-docs
        # in the build image resolves, verifies and unpacks them into
        # site/.bundles/ with lock.json. Anonymous: the packages are public,
        # so no token and no permission. task build never pulls.
        run: task bundles:pull
      - name: Build the main checkouts in explicit mode
        env:
          OPM_VERSIONS: v1.0=/src
          OPM_REQUIRE_DATES: '0'
        run: task build

  # The interim GitHub Pages deploy (README.md, "GitHub Pages (interim)"). It
  # publishes the Pages artifact the build job uploaded; it checks nothing out
  # and builds nothing, so the token that can publish never runs the build.
  pages-deploy:
    name: Deploy to GitHub Pages (interim)
    needs: [build, browser]
    # github.repository is set on every event; the schedule payload has no
    # repository object, so github.event.repository.fork would compare null.
    if: >-
      github.repository == 'open-platform-model/opmodel.dev' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:               # this job only; the workflow keeps contents: read
      pages: write             # create the Pages deployment
      id-token: write          # deploy-pages proves the run's identity to Pages
    environment:
      name: github-pages       # branch policy: main only (owner setting)
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:               # never cancel a deploy; a newer run waits its turn
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: The build targets this Pages site
        # A custom domain on the Pages site, or a renamed repository, moves the
        # site to a URL the build did not target: stop before publishing.
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |   # base_url has no trailing slash
          if [ "${SITE_URL%/}/" != "$PAGES_BASE_URL" ]; then
            echo "::error::GitHub Pages serves $SITE_URL, but the site was built for $PAGES_BASE_URL (README.md, GitHub Pages (interim))"
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          { echo '### GitHub Pages (interim)'; echo; echo "Deployed $GITHUB_SHA to $PAGE_URL"; } >> "$GITHUB_STEP_SUMMARY"
