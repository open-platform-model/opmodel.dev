# Builds and tests the site exactly as the Taskfile does locally. The build
# checks six source repositories, checked out beside opmodel.dev as they sit in
# the workspace, so OPM_WS (the parent of the opmodel.dev checkout) is
# $GITHUB_WORKSPACE. README.md "CI" names the local equivalents.
name: Site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly. v1.0 is a line version (site/versions.conf), resolved again on
    # every build, so the nightly run of main publishes what moved upstream:
    # new releases and docs revisions (the docs bundles of the newest cli 1.0
    # release and of the library, core and opm-operator releases it pins, of
    # the newest opm 1.0 release and of the newest opm-v4.* catalog release,
    # tab and docs). The sources-main job checks every source repository's
    # main together (task build:edge: every repository's edge docs bundle,
    # linted in bundle mode by opm-docs pull; build checks, links) and
    # publishes nothing. No source repository dispatches here; gh workflow
    # run Site --ref main publishes at once. An off-the-hour minute, because
    # GitHub delays runs at the top of the hour.
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # A page without a git date fails the build. Dates are computed on the host
  # by versions:prepare (materialise.sh), where git can read every source, so
  # a real build's container runs no git. CI can require them because every
  # source is a full clone (fetch-depth: 0), so every page has history. Locally
  # a page that is not committed yet has no date, so a local build leaves this
  # off.
  OPM_REQUIRE_DATES: '1'
  # The interim GitHub Pages site, until the Cloudflare deploy replaces it
  # (README.md, "GitHub Pages (interim)"). Never name it OPM_BASE_URL here:
  # every task build of the run, task ci's included, would build for this
  # path.
  PAGES_BASE_URL: https://open-platform-model.github.io/opmodel.dev/

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Concurrency is per job, one group per job, never workflow-level: a
    # workflow-level group would cancel a deploy job along with the rest of a
    # run, and two jobs sharing one cancelling group cancel each other. A
    # deploy job sets its own group without cancel-in-progress.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    # The working directory is a per-job default, never workflow-level: a
    # deploy job runs a step before its checkout, when opmodel.dev does not
    # exist yet. Action steps ignore it; their paths stay relative to
    # $GITHUB_WORKSPACE.
    defaults:
      run:
        working-directory: opmodel.dev
    steps:
      - name: Check out opmodel.dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: opmodel.dev
          fetch-depth: 0
          persist-credentials: false
      - name: Check out opm
        # fetch-depth: 0 brings every tag and every branch, the branches as
        # refs/remotes/origin/*, into each source checkout: the version
        # resolver reads them for a line version (the newest tag of a line,
        # origin/main, release/*) and refuses a shallow checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/opm
          ref: main
          path: opm
          fetch-depth: 0
          persist-credentials: false
      - name: Check out core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/core
          ref: main
          path: core
          fetch-depth: 0
          persist-credentials: false
      - name: Check out catalog_opm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/catalog_opm
          ref: main
          path: catalog_opm
          fetch-depth: 0
          persist-credentials: false
      - name: Check out cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/cli
          ref: main
          path: cli
          fetch-depth: 0
          persist-credentials: false
      - name: Check out library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/library
          ref: main
          path: library
          fetch-depth: 0
          persist-credentials: false
      - name: Check out opm-operator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/opm-operator
          ref: main
          path: opm-operator
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Install openspec
        run: npm install -g @fission-ai/openspec@1.12.0

      - name: Lint the workflows
        run: task ci:lint
      - name: Pull the docs bundles
        # The Catalogs tab's signed docs bundles (site/bundles.cue): opm-docs
        # in the build image resolves, verifies and unpacks them into
        # site/.bundles/ with lock.json. Anonymous: the packages are public,
        # so no token and no permission. task build never pulls.
        run: task bundles:pull
      - name: Upload the docs bundles' lock
        # The digests this build reads, so the browser job pulls exactly
        # them (--frozen) and QA checks what deploys. Every
        # event; include-hidden-files, because .bundles is a dot directory.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-lock
          path: opmodel.dev/site/.bundles/lock.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Check, build and test the site
        run: task ci
      - name: The build leaves the tree clean
        # A build step may write a file that is not gitignored; it shows up
        # here. .task/ holds Task's checksum files.
        run: |
          dirty=$(git status --porcelain --untracked-files=all -- . ':(exclude).task')
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty"
            echo "task ci left the tree dirty; run task ci, then git status --porcelain, and commit or ignore these paths" >&2
            exit 1
          fi
      - name: Summary
        # Every version's resolved refs: the ref the stamp names, where its
        # docs tree came from, the commit built and the rule that chose it
        # (not the checkout heads, which a line version does not read), and
        # the Enhancements section.
        run: |
          {
            echo '### Site build'
            echo
            echo '| Version | Repository | Ref | Docs from | Commit | Rule |'
            echo '|---|---|---|---|---|---|'
            jq -r '.versions | to_entries[] | .key as $v | .value.refs | to_entries[]
              | "| \($v) | \(.key) | \(.value.ref) | \(.value.docs // "") | [\(.value.sha[0:12])](https://github.com/open-platform-model/\(.key)/commit/\(.value.sha)) | \(.value.how) |"' site/public/build-stamp.json
            # The Enhancements section: its bundle's commit and digest.
            jq -r '.sections // {} | to_entries[] | select(.value.ref)
              | "| (unversioned) | \(.key) | \(.value.ref) | | [\(.value.sha[0:12])](https://github.com/open-platform-model/\(.key)/commit/\(.value.sha)) | \(.value.how) |"' site/public/build-stamp.json
            if jq -e '.sections.catalogs' site/public/build-stamp.json >/dev/null; then
              if jq -e '.sections.catalogs.frozen' site/public/build-stamp.json >/dev/null; then
                echo '::warning::The docs bundles were pulled frozen (site/bundles.frozen.json): the Catalogs tab and the docs bundles of the site versions show pinned digests, not the newest tags. Delete the file once upstream is fixed.'
                echo
                echo '> [!WARNING]'
                echo '> The docs bundles were pulled frozen (site/bundles.frozen.json); delete it once upstream is fixed.'
              fi
              echo
              echo '### Catalogs'
              echo
              echo '| Project | Segment | Version | Revision | Digest | Commit |'
              echo '|---|---|---|---|---|---|'
              jq -r '.sections.catalogs.bundles[]
                | "| \(.project) | \(.segment) | \(.version) | \(.revision) | \(if .local then "local" else .digest[0:19] end) | \(.commit[0:12]) |"' site/public/build-stamp.json
            fi
            # The docs bundles a version reads instead of git (docs-kit C16).
            if jq -e '[.versions[] | .bundles // empty] | length > 0' site/public/build-stamp.json >/dev/null; then
              echo
              echo '### Docs bundles'
              echo
              echo '| Site version | Project | Role | Tag | Version | Revision | Digest | Commit | Pins |'
              echo '|---|---|---|---|---|---|---|---|---|'
              jq -r '.versions | to_entries[] | .key as $v | (.value.bundles // [])[]
                | "| \($v) | \(.project) | \(.role) | \(.tag) | \(.version) | \(.revision) | \(if .local then "local" else .digest[0:19] end) | \(.commit[0:12]) | \(.pins | to_entries | map("\(.key) \(.value)") | join(", ")) |"' site/public/build-stamp.json
            fi
            echo
            echo "Files in site/public: $(find site/public -type f | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-public
          path: opmodel.dev/site/public
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-stamp
          path: opmodel.dev/site/public/build-stamp.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload the frozen manifest
        # The build as an anchored manifest at the refs it resolved: check out
        # opmodel.dev at the commit it names, copy it outside site/.versions/
        # and run OPM_VERSIONS_MANIFEST=<the copy> task build to rebuild the
        # same trees. Not on pull requests: their run builds GitHub's
        # temporary merge commit, which the header would name and which goes
        # away. Its own artifact, so build-stamp.json stays at the root of
        # build-stamp; include-hidden-files, because upload-artifact skips
        # paths under a dot directory such as .versions. It also holds the
        # docs bundles' lock, .bundles/lock.json beside .versions/frozen.conf:
        # copied to site/bundles.frozen.json, it pins task bundles:pull to the
        # digests this build read (README, "The Catalogs section").
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-manifest
          path: |
            opmodel.dev/site/.versions/frozen.conf
            opmodel.dev/site/.bundles/lock.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Build for GitHub Pages (interim)
        # The same sources, dates and checks, for the project site's path, into
        # site/public/ after every step that reads the default build has run.
        # It runs on pull requests too, so a change that breaks the path fails
        # there.
        env:
          OPM_BASE_URL: ${{ env.PAGES_BASE_URL }}
        run: |
          task build
          echo "GitHub Pages build for $OPM_BASE_URL: $(find site/public -type f | wc -l) files" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the GitHub Pages artifact
        # Every event, so a pull request proves the tar and upload of the real
        # Pages tree. Only pages-deploy is limited to main. It expires in a day.
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: opmodel.dev/site/public

  browser:
    name: Browser QA
    # It pulls the docs bundles the build job read (bundles-lock), so it
    # waits for that job.
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-browser
      cancel-in-progress: true
    defaults:
      run:
        working-directory: opmodel.dev
    # task qa builds site/public itself and that build checks all six source
    # roots, so this job runs beside build with the same seven checkouts
    # instead of downloading the site-public artifact.
    steps:
      - name: Check out opmodel.dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: opmodel.dev
          fetch-depth: 0
          persist-credentials: false
      - name: Check out opm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/opm
          ref: main
          path: opm
          fetch-depth: 0
          persist-credentials: false
      - name: Check out core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/core
          ref: main
          path: core
          fetch-depth: 0
          persist-credentials: false
      - name: Check out catalog_opm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/catalog_opm
          ref: main
          path: catalog_opm
          fetch-depth: 0
          persist-credentials: false
      - name: Check out cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/cli
          ref: main
          path: cli
          fetch-depth: 0
          persist-credentials: false
      - name: Check out library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/library
          ref: main
          path: library
          fetch-depth: 0
          persist-credentials: false
      - name: Check out opm-operator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/opm-operator
          ref: main
          path: opm-operator
          fetch-depth: 0
          persist-credentials: false

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Download the build job's docs bundles' lock
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-lock
          path: ${{ runner.temp }}/bundles-lock
      - name: Pull the docs bundles the build job read
        # Exactly the build job's digests (opm-docs pull --frozen, signatures
        # still checked), so this job checks the bundles that deploy, not
        # whatever edge moved to since. The stamp then says "frozen": true.
        env:
          OPM_BUNDLES_FROZEN: ${{ runner.temp }}/bundles-lock/lock.json
        run: task bundles:pull
      - name: Screenshots, accessibility and search smoke tests
        run: task qa
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # The screenshots are the only way to see why an accessibility or
        # search test failed in CI, so they upload from failed runs too.
        # upload-artifact skips every file under a directory whose name starts
        # with a dot, so without include-hidden-files .shots uploads nothing.
        if: always()
        with:
          name: site-shots
          path: opmodel.dev/site/.shots
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # The source pages on every source repository's main, built together:
  # task build:edge (openspec add-edge-build) pulls cli (the anchor), core,
  # library, opm-operator, opm and catalog-opm-docs from their edge docs
  # bundles (each publishes one on every push to main, generated reference
  # included) and the Catalogs tab at its newest digests, then runs an
  # explicit-mode build (OPM_VERSIONS=v1.0=/src, OPM_DOCS_BUNDLES=1). The
  # pull lints every page in bundle mode (opm-docs); the build runs every
  # check and the link crawl, so a page broken on main fails here before it
  # is released.
  # A missing edge bundle fails the pull (exit 2, naming the repository);
  # there is no fallback to git, whose main no longer holds the generated
  # reference. CI-only: it uploads only the edge lock, pages-deploy does not
  # need it, and it cannot change what is published. It pulls its own
  # bundles, so it waits for no job. The checkouts of the bundled repositories stay because
  # explicit mode checks every root before a container starts, and the
  # summary compares each edge bundle's commit with them. Dates are not its
  # subject: shallow checkouts, OPM_REQUIRE_DATES off. Never make it a
  # required status check: it reads other repositories' moving edge bundles,
  # so it turns red for reasons no opmodel.dev pull request can fix (a
  # product's main, a lagging edge publish, a GHCR outage, a catalog bundle
  # site/bundles.frozen.json pins only for the published build).
  sources-main:
    name: Source pages on main (not published)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-sources-main
      cancel-in-progress: true
    defaults:
      run:
        working-directory: opmodel.dev
    steps:
      - name: Check out opmodel.dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: opmodel.dev
          persist-credentials: false
      - name: Check out opm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/opm
          ref: main
          path: opm
          persist-credentials: false
      - name: Check out core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/core
          ref: main
          path: core
          persist-credentials: false
      - name: Check out catalog_opm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/catalog_opm
          ref: main
          path: catalog_opm
          persist-credentials: false
      - name: Check out cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/cli
          ref: main
          path: cli
          persist-credentials: false
      - name: Check out library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/library
          ref: main
          path: library
          persist-credentials: false
      - name: Check out opm-operator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/opm-operator
          ref: main
          path: opm-operator
          persist-credentials: false

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Build every main from the edge docs bundles
        # Derive site/.edge/bundles.cue, pull it into site/.edge/bundles/
        # (anonymous, read-only: no token), build in explicit mode. The task
        # sets OPM_REQUIRE_DATES=0 and the other build variables itself.
        run: task build:edge
      - name: The build read the edge docs bundles
        # Without OPM_DOCS_BUNDLES=1 an explicit build reads every product
        # from its git checkout and still passes, so the stamp must show
        # cli, core, library, opm-operator, opm and catalog-opm-docs read
        # from pulled (not local) edge bundles, and no other kind of bundle,
        # and the Enhancements section from its pulled bundle.
        run: |
          stamp=site/public/build-stamp.json
          if ! jq -e '(.versions["v1.0"].bundles // []) as $b
              | (["cli", "core", "library", "opm-operator", "opm", "catalog-opm-docs"] - [$b[].project]) == []
                and ($b | all(.version == "edge" and (.local | not)))
                and (.sections.enhancements.local == false)' "$stamp" >/dev/null; then
            echo "::error::The edge build did not read cli, core, library, opm-operator, opm and catalog-opm-docs, and the Enhancements section, from pulled edge bundles; the stamp's v1.0 bundles and its Enhancements section are below."
            jq '.versions["v1.0"].bundles // []' "$stamp"
            jq '.sections.enhancements // "no Enhancements section"' "$stamp"
            exit 1
          fi
      - name: Upload the edge lock
        # The digests this run read, also when the build failed after the
        # pull: OPM_BUNDLES_FROZEN=<this lock> task build:edge replays it.
        # include-hidden-files, because .edge is a dot directory.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-lock
          path: opmodel.dev/site/.edge/bundles/lock.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Summary
        # The edge docs bundles and catalog segments this run read, from the
        # lock (written by the pull even when the build then failed). Each
        # docs bundle's commit is compared with its repository's main
        # checkout: the job checks what edge points at, so a product whose
        # edge publish failed or lags is checked at an older commit, and a
        # warning says so.
        if: always()
        run: |
          lock=site/.edge/bundles/lock.json
          summary() { printf '%s\n' "$@" >> "$GITHUB_STEP_SUMMARY"; }
          summary '### Every main, from edge docs bundles (not published)' ''
          if [ ! -f "$lock" ]; then
            summary 'The edge pull wrote no lock: edge-config.sh, the image build or the pull failed (a missing edge bundle, a signature, lint or collision). See the "Build every main from the edge docs bundles" step log.'
            exit 0
          fi
          summary '| Project | Role | Tag | Version | Digest | Commit | Main checkout |' '|---|---|---|---|---|---|---|'
          jq -r '.docs // [] | .[] | [.project, .role, (.tag // ""), .version,
              (if .local then "local" else .digest[0:19] end), .commit, (.signer.repository // "")] | join("|")' "$lock" |
            while IFS='|' read -r project role tag version digest commit repo; do
              case "$project" in catalog-opm-docs) tree=catalog_opm ;; *) tree=$project ;; esac
              head=$(git -C "../$tree" rev-parse HEAD 2>/dev/null || true)
              if [ "$commit" = "$head" ]; then
                main='same commit'
              else
                main="**differs: ${head:0:12}**"
                echo "::warning::sources-main checked $project at its edge bundle's commit ${commit:0:12}, but its main checkout is at ${head:-(none)}: its edge publish failed or lags, so this run did not check $project's main."
              fi
              if [ -n "$repo" ]; then c="[${commit:0:12}]($repo/commit/$commit)"; else c=${commit:0:12}; fi
              summary "| $project | $role | $tag | $version | $digest | $c | $main |"
            done
          summary '' '| Catalog | Segment | Version | Revision | Digest | Commit |' '|---|---|---|---|---|---|'
          jq -r '.bundles[] | select(.root | startswith("/catalogs/"))
            | "| \(.project) | \(.segment) | \(.version) | \(.revision) | \(if .local then "local" else .digest[0:19] end) | \(.commit[0:12]) |"' "$lock" >> "$GITHUB_STEP_SUMMARY"
          summary '' '| Section | Segment | Digest | Commit |' '|---|---|---|---|'
          jq -r '.bundles[] | select(.root | startswith("/catalogs/") | not)
            | "| \(.project) (\(.root)) | \(.segment) | \(if .local then "local" else .digest[0:19] end) | \(.commit[0:12]) |"' "$lock" >> "$GITHUB_STEP_SUMMARY"

  # The interim GitHub Pages deploy (README.md, "GitHub Pages (interim)"). It
  # publishes the Pages artifact the build job uploaded; it checks nothing out
  # and builds nothing, so the token that can publish never runs the build.
  pages-deploy:
    name: Deploy to GitHub Pages (interim)
    needs: [build, browser]
    # github.repository is set on every event; the schedule payload has no
    # repository object, so github.event.repository.fork would compare null.
    if: >-
      github.repository == 'open-platform-model/opmodel.dev' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:               # this job only; the workflow keeps contents: read
      pages: write             # create the Pages deployment
      id-token: write          # deploy-pages proves the run's identity to Pages
    environment:
      name: github-pages       # branch policy: main only (owner setting)
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:               # never cancel a deploy; a newer run waits its turn
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: The build targets this Pages site
        # A custom domain on the Pages site, or a renamed repository, moves the
        # site to a URL the build did not target: stop before publishing.
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |   # base_url has no trailing slash
          if [ "${SITE_URL%/}/" != "$PAGES_BASE_URL" ]; then
            echo "::error::GitHub Pages serves $SITE_URL, but the site was built for $PAGES_BASE_URL (README.md, GitHub Pages (interim))"
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          { echo '### GitHub Pages (interim)'; echo; echo "Deployed $GITHUB_SHA to $PAGE_URL"; } >> "$GITHUB_STEP_SUMMARY"
