version: '3'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  deps:
    desc: Install Go dependencies (the site's live in its build image)
    cmds:
      - go mod download

  build:docgen:
    desc: Build the docgen tool
    cmds:
      - go build -o bin/docgen ./cmd/docgen
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - bin/docgen

  generate:schema:
    desc: Generate schema JSON from catalog
    deps: [build:docgen]
    cmds:
      - ./bin/docgen schema --catalog-dir ../catalog --output ./site/data/schema/
    sources:
      - ../catalog/v0/**/*.cue
    generates:
      - site/data/schema/*.json

  generate:cli:
    desc: Generate CLI reference markdown
    deps: [build:docgen]
    cmds:
      - ./bin/docgen cli --output ./site/content/docs/reference/cli/
    generates:
      - site/content/docs/reference/cli/*.md

  generate:
    desc: Generate all documentation
    deps: [generate:schema, generate:cli]

  # The site. Every step runs in Docker through site/scripts/run-in-image.sh,
  # which resolves OPM_WS, OPM_SRC_<REPO> and OPM_SRC_WORKTREE (the
  # environment or a task CLI var wins over the defaults) and checks every
  # source root before any container starts. The env map below hands the CLI
  # form (task build OPM_WS=...) to the script; an unset variable arrives
  # empty and counts as unset. Image tags come from the Dockerfile hashes.
  image:
    desc: Build the site's build image (Hugo, Pagefind, git), tagged by the hash of site/Dockerfile, if the tag is missing
    cmds:
      - sh site/scripts/run-in-image.sh image

  # The site versions (site/versions.conf), resolved on the host, where git
  # works in a worktree; build and serve run versions:prepare first, which
  # never fetches. A line version follows its release lines through the
  # roots' tags and refs/remotes/origin/*, so a local build after a release is
  # task versions:fetch build. The scripts read OPM_VERSIONS and
  # OPM_VERSIONS_MANIFEST from the environment (never Taskfile vars, which
  # would shadow it); the env map hands on the CLI form, and the source roots
  # resolve in run-in-image.sh as for a build.
  versions:prepare:
    desc: Resolve the site versions (main, anchored and line) from site/versions.conf on the host, offline; archive every version that is not source = main (build and serve run it first)
    env: &versions-env
      OPM_WS: '{{.OPM_WS}}'
      OPM_SRC_WORKTREE: '{{.OPM_SRC_WORKTREE}}'
      OPM_SRC_OPM: '{{.OPM_SRC_OPM}}'
      OPM_SRC_CORE: '{{.OPM_SRC_CORE}}'
      OPM_SRC_CATALOG_OPM: '{{.OPM_SRC_CATALOG_OPM}}'
      OPM_SRC_CLI: '{{.OPM_SRC_CLI}}'
      OPM_SRC_LIBRARY: '{{.OPM_SRC_LIBRARY}}'
      OPM_SRC_OPM_OPERATOR: '{{.OPM_SRC_OPM_OPERATOR}}'
      OPM_VERSIONS: '{{.OPM_VERSIONS}}'
      OPM_VERSIONS_MANIFEST: '{{.OPM_VERSIONS_MANIFEST}}'
    cmds:
      # Writes site/.versions/versions.tsv and frozen.conf; with OPM_VERSIONS set it only removes stale ones.
      - sh site/scripts/resolve-versions.sh
      # The archives of anchored and line versions and every page's git date; with OPM_VERSIONS set, nothing.
      - sh site/scripts/materialise.sh

  versions:check:
    desc: Resolve every site version, line versions from the roots' tags and remote-tracking refs, and print its refs, SHAs and rules (site/versions.conf, or OPM_VERSIONS_MANIFEST); writes nothing
    env: *versions-env
    cmds:
      - sh site/scripts/resolve-versions.sh --check

  # The only network step of the versions: git fetch in the six source roots
  # with explicit refspecs, the tag one without +, and --no-prune
  # --no-prune-tags --no-write-fetch-head, so it never moves or deletes a tag
  # and writes nothing in a worktree. It fails, naming the root, when a local
  # tag differs from origin's.
  versions:fetch:
    desc: Fetch every tag and branch of the six source roots from origin (refs/remotes/origin/*), never moving or deleting a tag; run it before a local build after a release
    env: *versions-env
    cmds:
      - sh site/scripts/resolve-versions.sh --fetch

  # The two-version test never writes site/public/: it builds into
  # site/.check/versions-test/. The last steps restore the real manifest's
  # site/.versions/ as ordinary steps, so a failed restore fails the task and
  # a leftover test version is caught; the deferred step restores it after a
  # failure only (Task ignores a failing defer).
  versions:test:
    desc: Resolver regression tests (host git), then a two-version build into site/.check/versions-test/ and its assertions
    env: *versions-env
    cmds:
      - sh site/tests/versions/test-resolve.sh
      - defer: '{{if .EXIT_CODE}}OPM_VERSIONS= OPM_VERSIONS_MANIFEST= sh site/scripts/resolve-versions.sh && OPM_VERSIONS= sh site/scripts/materialise.sh{{end}}'
      - OPM_VERSIONS= OPM_VERSIONS_MANIFEST=site/tests/versions/two-versions.conf sh site/scripts/resolve-versions.sh
      - OPM_VERSIONS= sh site/scripts/materialise.sh
      - sh site/tests/versions/check-two-versions.sh
      - OPM_VERSIONS= OPM_VERSIONS_MANIFEST= sh site/scripts/resolve-versions.sh
      - OPM_VERSIONS= sh site/scripts/materialise.sh
      - |
        if grep -q '^v0\.9[[:space:]]' site/.versions/versions.tsv || [ -e site/.versions/v0.9 ]; then
          echo "versions:test: the real manifest was not restored: site/.versions/ still holds the test version v0.9" >&2
          exit 1
        fi
        echo "versions:test: site/.versions/ restored for site/versions.conf"

  # OPM_BASE_URL (the site's base URL, which may carry a path) reaches the
  # build through an assignment in the command, never through the env map: in
  # Task 3.52.0 an env entry loses to an exported variable, so qa and shots,
  # which pass '', could not force the default. The template var comes from a
  # call var, a CLI var (task build OPM_BASE_URL=<url>) or the environment, in
  # that order; empty means hugo.toml's baseURL.
  build:
    desc: Build the site into site/public/ in Docker, with no network (lint, checks, hugo)
    deps: [versions:prepare]
    env: &hugo-env
      OPM_WS: '{{.OPM_WS}}'
      OPM_SRC_WORKTREE: '{{.OPM_SRC_WORKTREE}}'
      OPM_SRC_OPM: '{{.OPM_SRC_OPM}}'
      OPM_SRC_CORE: '{{.OPM_SRC_CORE}}'
      OPM_SRC_CATALOG_OPM: '{{.OPM_SRC_CATALOG_OPM}}'
      OPM_SRC_CLI: '{{.OPM_SRC_CLI}}'
      OPM_SRC_LIBRARY: '{{.OPM_SRC_LIBRARY}}'
      OPM_SRC_OPM_OPERATOR: '{{.OPM_SRC_OPM_OPERATOR}}'
      OPM_REQUIRE_DATES: '{{.OPM_REQUIRE_DATES}}'
      OPM_VERSIONS: '{{.OPM_VERSIONS}}'
      SITE_PORT: '{{.SITE_PORT}}'
    cmds:
      - OPM_BASE_URL={{shellQuote (.OPM_BASE_URL | default "")}} sh site/scripts/run-in-image.sh build

  serve:
    desc: Run the dev server on http://127.0.0.1:${SITE_PORT:-1313}/ over the resolved versions (a line version serves its archives; live editing is OPM_VERSIONS=v1.0=/src task serve)
    deps: [versions:prepare]
    env: *hugo-env
    cmds:
      - sh site/scripts/run-in-image.sh serve

  preview:
    desc: Serve the built site/public/ on http://127.0.0.1:${SITE_PORT:-1313}/ (run build first)
    env:
      SITE_PORT: '{{.SITE_PORT}}'
    cmds:
      - sh site/scripts/run-in-image.sh preview

  lint:sources:
    desc: Lint the six source repos' docs/site pages against the page dialect
    env: *hugo-env
    cmds:
      - sh site/scripts/run-in-image.sh lint

  test:site:
    desc: Prove the build checks on fixtures (site/tests, in Docker with no network), then run versions:test
    cmds:
      - sh site/scripts/run-in-image.sh test
      - task: versions:test

  qa:image:
    desc: Build the QA image, opmodel-dev-qa:<12 hex of sha256 of site/tests/browser/Dockerfile>, if the tag is missing
    cmds:
      - sh site/scripts/run-in-image.sh qa-image

  shots:
    desc: Build the site, then screenshot every figure page and the extras in six variants into site/.shots/
    deps: [qa:image]
    cmds:
      # The browser checks serve site/public/ at the root, so QA always builds
      # the default base URL, whatever OPM_BASE_URL the caller exported.
      - task: build
        vars: {OPM_BASE_URL: ''}
      - sh site/scripts/run-in-image.sh shots

  qa:
    desc: Build the site, then the screenshots, the axe accessibility and the search smoke tests (no network, no port)
    deps: [qa:image]
    cmds:
      # The browser checks serve site/public/ at the root, so QA always builds
      # the default base URL, whatever OPM_BASE_URL the caller exported.
      - task: build
        vars: {OPM_BASE_URL: ''}
      - sh site/scripts/run-in-image.sh qa

  # The brand rasters, rendered by Chromium in the QA image with the flags
  # task qa uses (no network, no port, the repo at /work/repo). Their output is
  # committed and never hand-edited; the site build never runs them.
  brand:favicons:
    desc: Regenerate the favicon PNGs and favicon.ico in site/static/ from favicon.svg (QA image, no network)
    deps: [qa:image]
    cmds:
      - docker run --rm --init --network none --user "$(id -u):$(id -g)" --env HOME=/tmp --env PYTHONDONTWRITEBYTECODE=1 --volume "$(pwd -P):/work/repo" --entrypoint python3 "$(sh site/scripts/run-in-image.sh qa-tag)" /work/repo/site/tools/favicons.py

  brand:og:
    desc: Regenerate site/static/images/og-default.png, the Open Graph card, from hugo.toml's title and description and the mark (QA image, no network)
    deps: [qa:image]
    cmds:
      - docker run --rm --init --network none --user "$(id -u):$(id -g)" --env HOME=/tmp --env PYTHONDONTWRITEBYTECODE=1 --volume "$(pwd -P):/work/repo" --entrypoint python3 "$(sh site/scripts/run-in-image.sh qa-tag)" /work/repo/site/tools/og-card.py

  ci:
    desc: What CI runs for the site - check, the image, the build and the site tests
    cmds:
      - task: check
      - task: image
      - task: build
      - task: test:site

  # The workflows' lint, and the local gate for them: nothing runs a workflow
  # before its branch is pushed. Read-only, no network, as the calling user.
  # Extra flags pass through: task ci:lint -- -verbose
  ci:lint:
    desc: Lint .github/workflows with actionlint (and its bundled shellcheck), in a pinned image
    vars:
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    cmds:
      - docker run --rm --network none --user "$(id -u):$(id -g)" --volume "{{.ROOT_DIR}}:/repo:ro" --workdir /repo {{.ACTIONLINT_IMAGE}} -color {{.CLI_ARGS}}

  clean:
    desc: Remove generated files (build output, generated inputs, check and screenshot output)
    cmds:
      - rm -rf bin/ site/data/schema/ site/content/docs/reference/cli/opm*.md
      - rm -rf site/public/ site/resources/ site/.hugo_build.lock site/data/opm/ site/config/production/ site/config/development/ site/.gen/ site/.versions/ site/.check/ site/.shots/

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  vet:
    desc: Vet Go code
    cmds:
      - go vet ./...

  test:
    desc: Run tests
    cmds:
      - go test -v ./...

  # No openspec:install task: this repo runs no npm on the host. The CLI is
  # installed outside the repo, and a CI runner installs its own pinned copy.
  openspec:check:
    desc: Validate every active OpenSpec change under strict mode
    preconditions:
      - sh: command -v openspec >/dev/null
        msg: "openspec not found on PATH: install the OpenSpec CLI 1.12.0 (@fission-ai/openspec)"
    cmds:
      - openspec validate --all --strict --no-interactive

  check:
    desc: Run all checks (fmt, vet, openspec, test)
    cmds:
      - task: fmt
      - task: vet
      - task: openspec:check
      - task: test
