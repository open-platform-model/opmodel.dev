version: '3'

vars:
  IMAGE: opmodel-dev-site:local
  UID:
    sh: id -u
  GID:
    sh: id -g
  # Runs a command in the site's build image with the repository mounted, as
  # the calling user so files written to site/ stay owned by them. The
  # workspace is mounted read-only so the site can read each source
  # repository's docs/site/ (site/scripts/sources.mjs). Declared after UID and
  # GID because Task resolves vars in order.
  SITE_RUN: >-
    docker run --rm --init
    --user {{.UID}}:{{.GID}}
    --volume {{.ROOT_DIR}}:/work/repo
    --volume {{.ROOT_DIR}}/..:/work/workspace:ro
    --env OPM_DOCS_WORKSPACE=/work/workspace

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  deps:
    desc: Install Go dependencies (the site's live in its build image)
    cmds:
      - go mod download

  image:
    desc: Build the site's build image (Node, git and the npm packages)
    cmds:
      - docker build --quiet --tag {{.IMAGE}} site

  build:docgen:
    desc: Build the docgen tool
    cmds:
      - go build -o bin/docgen ./cmd/docgen
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - bin/docgen

  generate:schema:
    desc: Generate schema JSON from catalog
    deps: [build:docgen]
    cmds:
      - ./bin/docgen schema --catalog-dir ../catalog --output ./site/data/schema/
    sources:
      - ../catalog/v0/**/*.cue
    generates:
      - site/data/schema/*.json

  generate:cli:
    desc: Generate CLI reference markdown
    deps: [build:docgen]
    cmds:
      - ./bin/docgen cli --output ./site/content/docs/reference/cli/
    generates:
      - site/content/docs/reference/cli/*.md

  generate:
    desc: Generate all documentation
    deps: [generate:schema, generate:cli]

  serve:
    desc: Run the dev server for the latest version on http://localhost:4321/
    deps: [image]
    cmds:
      - '{{.SITE_RUN}} --publish 127.0.0.1:4321:4321 {{.IMAGE}} npm run dev -- --host 0.0.0.0 --port 4321'

  build:
    desc: Build every site version into site/dist/
    deps: [image]
    cmds:
      - '{{.SITE_RUN}} {{.IMAGE}} npm run build'

  preview:
    desc: Serve the built site, every version, on http://localhost:4321/
    deps: [build]
    cmds:
      - '{{.SITE_RUN}} --publish 127.0.0.1:4321:4321 {{.IMAGE}} npm run preview'

  clean:
    desc: Clean generated files
    cmds:
      - rm -rf bin/ site/dist/ site/.astro/ site/.versions/ site/src/content/docs/ site/src/generated/ site/data/schema/ site/content/docs/reference/cli/opm*.md

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  vet:
    desc: Vet Go code
    cmds:
      - go vet ./...

  test:
    desc: Run tests
    cmds:
      - go test -v ./...

  check:
    desc: Run all checks (fmt, vet, test)
    cmds:
      - task: fmt
      - task: vet
      - task: test
