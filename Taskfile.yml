version: '3'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # The site. Every step runs in Docker through site/scripts/run-in-image.sh.
  # The build reads no repository but this one: every source page comes from
  # a signed docs bundle that task bundles:pull resolves, verifies, lints and
  # locks into site/.bundles/. The env maps hand the CLI form
  # (task build OPM_BUNDLES=...) to the script; an unset variable arrives
  # empty and counts as unset. Image tags come from the Dockerfile hashes.
  image:
    desc: Build the site's build image (Hugo, Pagefind, opm-docs, git, jq), tagged by the hash of site/Dockerfile, if the tag is missing
    cmds:
      - sh site/scripts/run-in-image.sh image

  # The docs bundles of site/bundles.cue (the site versions' docs projects,
  # the Catalogs tab and the Enhancements section): opm-docs pull in the
  # build image, the only step besides the image builds that reaches the
  # network (an all-local pull does not). It resolves every tag in GHCR,
  # verifies each Sigstore signature, lints every page in bundle mode and
  # unpacks into site/.bundles/ with lock.json (never committed; the build
  # stamp records it). A local build after a release is task bundles:pull
  # build. task build never pulls, and fails without a lock pulled for the
  # current bundles.cue.
  # OPM_BUNDLES_LOCAL="catalog-opm@4.5=<release build> catalog-opm@edge=<dir>"
  # takes segments from local bundle trees (an author's preview); a local
  # project skips the registry entirely, so name a release minor too, or the
  # docs' /catalogs/opm/4/ links fail. A site version's docs project is
  # named by the version: cli@v1.0=<dir> (docs-kit C16).
  # OPM_BUNDLES_FROZEN=<lock>, else a
  # committed site/bundles.frozen.json, pulls exactly that lock's digests
  # (a bad bundle upstream; CI's browser job). A frozen
  # pull still fetches from GHCR and Sigstore: an outage of either is
  # waited out, not worked around.
  # OPM_BUNDLES_CONFIG and OPM_BUNDLES_OUT choose another pull config and
  # output directory (defaults site/bundles.cue, site/.bundles; build:edge
  # names site/.edge/bundles.cue and site/.edge/bundles). With another
  # config a committed site/bundles.frozen.json is not applied: it was
  # pulled for bundles.cue. The pull sweeps its output, so OPM_BUNDLES_OUT
  # must be a dot-directory under site/ with no tracked file and, when not
  # empty, a lock.json. The pull never reads OPM_BUNDLES, which names a
  # tree a build reads.
  bundles:pull:
    desc: Pull, verify, lint and unpack the docs bundles of site/bundles.cue (the site versions' docs projects, the Catalogs tab, the Enhancements section) into site/.bundles/ (network)
    env:
      OPM_BUNDLES_LOCAL: '{{.OPM_BUNDLES_LOCAL}}'
      OPM_BUNDLES_FROZEN: '{{.OPM_BUNDLES_FROZEN}}'
      OPM_BUNDLES_CONFIG: '{{.OPM_BUNDLES_CONFIG}}'
      OPM_BUNDLES_OUT: '{{.OPM_BUNDLES_OUT}}'
    cmds:
      - sh site/scripts/run-in-image.sh pull

  # The two-version test never writes site/public/: it builds into
  # site/.check/versions-test/, from the docs bundles of the last
  # task bundles:pull (v1.0) and the fixture docs bundles relabelled as v0.9.
  versions:test:
    desc: A two-version build (v1.0 from site/.bundles/, a test v0.9 from the fixture bundles) into site/.check/versions-test/ and its assertions
    cmds:
      - sh site/tests/versions/check-two-versions.sh

  # OPM_BASE_URL (the site's base URL, which may carry a path) reaches the
  # build through an assignment in the command, never through the env map: in
  # Task 3.52.0 an env entry loses to an exported variable, so qa and shots,
  # which pass '', could not force the default. The template var comes from a
  # call var, a CLI var (task build OPM_BASE_URL=<url>) or the environment, in
  # that order; empty means hugo.toml's baseURL.
  build:
    desc: Build the site into site/public/ in Docker, with no network, from the docs bundles of the last task bundles:pull (checks, hugo)
    env: &hugo-env
      OPM_REQUIRE_DATES: '{{.OPM_REQUIRE_DATES}}'
      OPM_BUNDLES: '{{.OPM_BUNDLES}}'
      SITE_PORT: '{{.SITE_PORT}}'
    cmds:
      - OPM_BASE_URL={{shellQuote (.OPM_BASE_URL | default "")}} sh site/scripts/run-in-image.sh build

  serve:
    desc: Run the dev server on http://127.0.0.1:${SITE_PORT:-1313}/ over the docs bundles of the last task bundles:pull (a source repository's pages - opm-docs serve, or OPM_BUNDLES_LOCAL with bundles:pull)
    env: *hugo-env
    cmds:
      - sh site/scripts/run-in-image.sh serve

  # The edge build (openspec add-edge-build), CI-only: CI's sources-main job
  # runs it to check every repository's main together, and publishes nothing.
  # cli (the anchor), core, library, opm-operator, opm and catalog-opm-docs
  # come from their edge docs bundles, the Catalogs tab resolved fresh.
  # edge-config.sh derives the pull config from site/bundles.cue (every
  # block but versions, which becomes v1.0 at edge); the pull writes
  # site/.edge/bundles/, never the site/.bundles/ task build reads, and the
  # build reads it through OPM_BUNDLES like any other build. A missing edge
  # bundle fails the pull (exit 2, naming the repository). Each step runs as
  # its own task process with its variables assigned in the command, because
  # an env map entry loses to an exported variable and a dependency never
  # sees a call's vars. OPM_BUNDLES_LOCAL="core@v1.0=<core>/out/core" checks a
  # product's branch against every other main; OPM_BUNDLES_FROZEN=<edge-lock>
  # replays a failed CI run.
  build:edge:
    desc: Build every repository's main together from their edge docs bundles into site/public/ (CI's sources-main; not published)
    env:
      OPM_BUNDLES_LOCAL: '{{.OPM_BUNDLES_LOCAL}}'
      OPM_BUNDLES_FROZEN: '{{.OPM_BUNDLES_FROZEN}}'
    cmds:
      - sh site/scripts/edge-config.sh
      - OPM_BUNDLES_CONFIG=site/.edge/bundles.cue OPM_BUNDLES_OUT=site/.edge/bundles "{{.TASK_EXE}}" bundles:pull
      - OPM_BUNDLES=site/.edge/bundles OPM_REQUIRE_DATES=0 OPM_BASE_URL= "{{.TASK_EXE}}" build

  preview:
    desc: Serve the built site/public/ on http://127.0.0.1:${SITE_PORT:-1313}/ (run build first)
    env:
      SITE_PORT: '{{.SITE_PORT}}'
    cmds:
      - sh site/scripts/run-in-image.sh preview

  test:site:
    desc: Prove the build checks on fixtures (site/tests, in Docker with no network), then run versions:test
    cmds:
      - sh site/scripts/run-in-image.sh test
      - task: versions:test

  qa:image:
    desc: Build the QA image, opmodel-dev-qa:<12 hex of sha256 of site/tests/browser/Dockerfile>, if the tag is missing
    cmds:
      - sh site/scripts/run-in-image.sh qa-image

  shots:
    desc: Build the site, then screenshot every figure page and the extras in six variants into site/.shots/
    deps: [qa:image]
    cmds:
      # The browser checks serve site/public/ at the root, so QA always builds
      # the default base URL, whatever OPM_BASE_URL the caller exported.
      - task: build
        vars: {OPM_BASE_URL: ''}
      - sh site/scripts/run-in-image.sh shots

  qa:
    desc: Build the site, then the screenshots, the axe accessibility, the search and the theme switch smoke tests (no network, no port)
    deps: [qa:image]
    cmds:
      # The browser checks serve site/public/ at the root, so QA always builds
      # the default base URL, whatever OPM_BASE_URL the caller exported.
      - task: build
        vars: {OPM_BASE_URL: ''}
      - sh site/scripts/run-in-image.sh qa

  # The brand rasters, rendered by Chromium in the QA image with the flags
  # task qa uses (no network, no port, the repo at /work/repo). Their output is
  # committed and never hand-edited; the site build never runs them.
  brand:favicons:
    desc: Regenerate the favicon PNGs and favicon.ico in site/static/ from favicon.svg (QA image, no network)
    deps: [qa:image]
    cmds:
      - docker run --rm --init --network none --user "$(id -u):$(id -g)" --env HOME=/tmp --env PYTHONDONTWRITEBYTECODE=1 --volume "$(pwd -P):/work/repo" --entrypoint python3 "$(sh site/scripts/run-in-image.sh qa-tag)" /work/repo/site/tools/favicons.py

  brand:og:
    desc: Regenerate site/static/images/og-default.png, the Open Graph card, from hugo.toml's title and description and the mark (QA image, no network)
    deps: [qa:image]
    cmds:
      - docker run --rm --init --network none --user "$(id -u):$(id -g)" --env HOME=/tmp --env PYTHONDONTWRITEBYTECODE=1 --volume "$(pwd -P):/work/repo" --entrypoint python3 "$(sh site/scripts/run-in-image.sh qa-tag)" /work/repo/site/tools/og-card.py

  ci:
    desc: What CI runs for the site - check, the image, the build and the site tests
    cmds:
      - task: check
      - task: image
      - task: build
      - task: test:site

  # The workflows' lint, and the local gate for them: nothing runs a workflow
  # before its branch is pushed. Read-only, no network, as the calling user.
  # Extra flags pass through: task ci:lint -- -verbose
  ci:lint:
    desc: Lint .github/workflows with actionlint (and its bundled shellcheck), in a pinned image
    vars:
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    cmds:
      - docker run --rm --network none --user "$(id -u):$(id -g)" --volume "{{.ROOT_DIR}}:/repo:ro" --workdir /repo {{.ACTIONLINT_IMAGE}} -color {{.CLI_ARGS}}

  clean:
    desc: Remove generated files (build output, generated inputs, check and screenshot output)
    cmds:
      - rm -rf site/public/ site/resources/ site/.hugo_build.lock site/data/opm/ site/config/production/ site/config/development/ site/.gen/ site/.check/ site/.shots/ site/.bundles/ site/.cache/ site/.edge/

  # No openspec:install task: this repo runs no npm on the host. The CLI is
  # installed outside the repo, and a CI runner installs its own pinned copy.
  openspec:check:
    desc: Validate every active OpenSpec change under strict mode
    preconditions:
      - sh: command -v openspec >/dev/null
        msg: "openspec not found on PATH: install the OpenSpec CLI 1.12.0 (@fission-ai/openspec)"
    cmds:
      - openspec validate --all --strict --no-interactive

  check:
    desc: Run all checks (openspec)
    cmds:
      - task: openspec:check
