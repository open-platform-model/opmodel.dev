; site/tests/versions/two-versions.conf: the two-version test manifest. task versions:test
; builds it (OPM_VERSIONS_MANIFEST selects it); the version names are test-only.
; v1.0 is site/versions.conf's: the newest opm-v4.* catalog tag and opm at main, resolved again
; on every run, and cli, core, library and opm-operator from the docs bundles the real pull
; wrote (site/.bundles/, task bundles:pull; check-two-versions.sh copies their docs entries).
; v0.9 is anchored at the page-dialect merges, the oldest refs that build (cli a little later,
; below): the cli there pins library, core and opm-operator releases older than their floors,
; so those pins are overridden.

[repo "opm"]
	floor = 2a73f5282a2b487e209ed2d0717da46c8a17a5da
[repo "core"]
	floor = 647dfdcf3c7f0000e1efcf74343e14e4f3a83579
[repo "catalog_opm"]
	floor = 2bbf4579bf44c6b77da104733eb727b1e72540d1
[repo "cli"]
	floor = 7d8f44b68a86f86ae7a79dfd42a8236bba4e2cb8
[repo "library"]
	floor = e623d40b45976dae83fe0c676a52867374e647e2
[repo "opm-operator"]
	floor = c15d93946d3d067809de4709529f884591b46345

[version "v1.0"]
	label = v1.0 (beta)
	weight = 1
	default = true
	catalog-line = opm-v4
	from-bundles = cli core library opm-operator

[version "v0.9"]
	label = v0.9 (test)
	weight = 2
	; cli past its floor at the commit that first carries the generated command reference
	; (cli #275): the floor catalog_opm's contract page links /docs/reference/cli/, which
	; only the site's placeholder served until the placeholders were deleted. Its install
	; page links /docs/start/install-the-operator/, so opm-operator moves past its floor too.
	cli = 8e3c15e4e5f9e8325dbe5eb42bfc8e78cd04e95d
	catalog = 2bbf4579bf44c6b77da104733eb727b1e72540d1
	opm = 2a73f5282a2b487e209ed2d0717da46c8a17a5da
	override = library e623d40b45976dae83fe0c676a52867374e647e2 the cli pins a pre-floor library
	override = core 647dfdcf3c7f0000e1efcf74343e14e4f3a83579 the cli pins a pre-floor core
	override = opm-operator 620319cecdcc2131ac79e4ce6881b9c544cfc6e4 the cli pins a pre-floor operator; past its floor where start/install-the-operator.md exists, which the cli's install page links

; The enhancements section, as in site/versions.conf: built once, into the default version only.
[section "enhancements"]
	ref = origin/main
