; site/tests/versions/two-versions.conf: the display keys of the two-version test
; (task versions:test; check-two-versions.sh passes it as OPM_VERSIONS_CONF). The version
; names are test-only, and the test's lock names exactly these two: v1.0 is
; site/versions.conf's, read from the docs bundles the real pull wrote (site/.bundles/,
; task bundles:pull), and v0.9 is the fixture docs bundles (site/tests/fixtures/bundles/
; _versions/v1.0/) relabelled, so the two versions publish different pages.

[version "v1.0"]
	label = v1.0 (beta)
	weight = 1
	default = true

[version "v0.9"]
	label = v0.9 (test)
	weight = 2
