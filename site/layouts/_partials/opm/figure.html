{{- /* The frame every figure shares: a <figure> whose caption
       states the figure's one point, an <svg> that carries the same text as
       its accessible label, and an arrowhead marker named after the figure, so
       two figures on one page never share an id. Args: id, title, claim,
       width, height, body (the SVG elements, drawn with the opm-fig classes;
       reference the arrowhead as marker-end="url(#<id>-arrow)"), and the
       optional caption: false leaves the visible caption out (the landing's
       figure, beside the hero text), while the claim stays the SVG's
       accessible label. Page-dialect figures never pass it. */ -}}
<figure class="opm-fig">
  <svg viewBox="0 0 {{ .width }} {{ .height }}" role="img" aria-label="{{ .claim }}">
    <title>{{ .title }}</title>
    <defs>
      <marker id="{{ .id }}-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path>
      </marker>
    </defs>
    {{ .body }}
  </svg>
  {{- if ne .caption false }}
  <figcaption>{{ .claim }}</figcaption>
  {{- end }}
</figure>
