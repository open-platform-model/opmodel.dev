; site/versions.conf: how each site version is shown (git-config syntax). The
; version list itself is site/bundles.cue `versions`: the docs bundles' lock
; names every version the site builds, and the build fails when this file
; names a different set (site/scripts/sections.sh). Each version has exactly
; three keys, and any other section or key fails the build:
;   label    the switcher's text
;   weight   its position, a positive integer (lower first), one per version
;   default  true for exactly one version: / and /latest/ go to it
; See README "Site versions".

[version "v1.0"]
	label = v1.0 (beta)
	weight = 1
	default = true
