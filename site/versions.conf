; site/versions.conf: the versions opmodel.dev publishes. The only list; edit it by commit.
; git-config syntax (read with `git config --file`); see README "Site versions".
; site/scripts/resolve-versions.sh reads it on the host; `task versions:check` prints what it resolves.
;
; A version is either `source = main` (every source repository at its checked-out HEAD,
; allowed for one version and only until v1.0.0-beta.N tags exist; the build records the
; SHAs) or anchored at fixed refs, bumped by commit and never a moving line: `cli` (a tag or
; a full SHA) is the anchor, library, core and opm-operator come from its pins, `catalog` and
; `opm` are explicit, and `override = <repo> <ref> <reason>` replaces one of them.
;
; Each repository's floor is its page-dialect merge: no ref older than its floor builds,
; so a tag cut before it can never be an anchor or a pin.

[repo "opm"]
	floor = 2a73f5282a2b487e209ed2d0717da46c8a17a5da
[repo "core"]
	floor = 647dfdcf3c7f0000e1efcf74343e14e4f3a83579
[repo "catalog_opm"]
	floor = 2bbf4579bf44c6b77da104733eb727b1e72540d1
[repo "cli"]
	floor = 7d8f44b68a86f86ae7a79dfd42a8236bba4e2cb8
[repo "library"]
	floor = e623d40b45976dae83fe0c676a52867374e647e2
[repo "opm-operator"]
	floor = c15d93946d3d067809de4709529f884591b46345

[version "v1.0"]
	label = v1.0 (beta)
	weight = 1
	default = true
	; Every repository at main until v1.0.0-beta.N tags exist (the owner's day-one choice);
	; the build records the SHAs.
	source = main
