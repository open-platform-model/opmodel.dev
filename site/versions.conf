; site/versions.conf: the versions opmodel.dev publishes. The only list; edit it by commit.
; git-config syntax (read with `git config --file`); see README "Site versions".
; site/scripts/resolve-versions.sh reads it on the host; `task versions:check` prints what it resolves.
;
; A version has one of three kinds:
; - line: `cli-line = vX.Y` and `catalog-line = opm-vN`, resolved again on every build, the
;   nightly one included. cli is the newest vX.Y.* tag (prereleases included, by semver
;   precedence); library, core and opm-operator are exactly what that tag pins; catalog_opm is
;   the newest opm-vN.* tag; opm is the head of main. The docs of cli, library, opm-operator,
;   core and catalog_opm come from their release/<prefix>vX.Y branch once it exists, else from
;   main while main still releases that minor, else from the named release's tag; the stamp
;   still names the release. Every build records the SHA of every repository. Until 2026-10-01
;   a version moved only by a commit that bumped a fixed anchor; the owner reversed that rule
;   on 2026-10-01 for the published versions.
; - anchored: fixed refs, bumped by commit. `cli` (a tag or a full SHA) is the anchor; library,
;   core and opm-operator come from its pins; `catalog` and `opm` are explicit.
; - `source = main`: every source repository at its checked-out HEAD, for tests and local
;   live editing; at most one version.
; `from-bundles = <repo> ...` names the repositories a version reads from their docs bundles
; (site/bundles.cue decides; this mirrors it for the resolver): they get no row and no key.
; `override = <repo> <ref> <reason>` replaces one row (never cli). In a line version it is only
; for a row that fails, and the build fails once the row it replaced passes again.
;
; Each repository's floor is its page-dialect merge: no ref older than its floor builds,
; so a tag cut before it can never be an anchor, a pin or the newest tag of a line.

[repo "opm"]
	floor = 2a73f5282a2b487e209ed2d0717da46c8a17a5da
[repo "core"]
	floor = 647dfdcf3c7f0000e1efcf74343e14e4f3a83579
[repo "catalog_opm"]
	floor = 2bbf4579bf44c6b77da104733eb727b1e72540d1
[repo "cli"]
	floor = 7d8f44b68a86f86ae7a79dfd42a8236bba4e2cb8
[repo "library"]
	floor = e623d40b45976dae83fe0c676a52867374e647e2
[repo "opm-operator"]
	floor = c15d93946d3d067809de4709529f884591b46345

[version "v1.0"]
	label = v1.0 (beta)
	weight = 1
	default = true
	; Follows the opm catalog's v4 major (a new catalog minor needs no commit; a new catalog
	; major does). cli, core, library, opm-operator and opm come from their docs bundles:
	; site/bundles.cue anchors v1.0 at the cli 1.0 line, pins library, core and opm-operator
	; at exactly what that cli release pins, and takes opm at its own 1.0 line; from-bundles
	; mirrors that set for the resolver.
	catalog-line = opm-v4
	from-bundles = cli core library opm-operator opm

; The enhancements, OPM's design record: one unversioned section at /enhancements/, built in
; the same run as the docs and outside every version. `ref` is the enhancements repository's
; origin/main (its remote-tracking ref, never a local branch or HEAD), a tag or a full SHA,
; resolved on every build and recorded in the build stamp. When a push there breaks the
; build, `override = <full SHA> <reason>` pins a commit that built, until it is fixed there.
[section "enhancements"]
	ref = origin/main
