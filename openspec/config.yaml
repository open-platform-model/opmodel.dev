schema: docs-site-change

context: |
  # opmodel.dev Development Constitution

  ## Core Principles (Documentation Site)

  This repo builds the public documentation site opmodel.dev, plus the `docgen` Go tool that
  generates reference pages from the CUE schema and the CLI's cobra commands. The site is a
  Hugo site on the Hextra theme (neutral skin), built only inside Docker. Pages authored in
  six source repos (opm, core, catalog_opm, cli, library, opm-operator), each in its
  `docs/site/` tree, are assembled here at build time. Design principles for the whole repo
  are in CONSTITUTION.md; commands and working rules are in AGENTS.md.

  ### I. Content Lives in the Owning Repository
  A page's source lives in the repository whose change would make it wrong. This
  repo owns the pipeline, the theme overrides and the few site-owned pages (the landing and
  the section overviews); it does not own the prose it assembles.
  - A change here that needs page prose, front matter or links changed in a source repo names
    that as a follow-up in that repo. It never edits another repo's `docs/site/` from here.
  - Source pages follow the workspace page dialect: section pages are `_index.md`, order is
    `weight`, callouts are GitHub alerts, figures are `{{< opm/<name> >}}` shortcodes in `.md`
    files. The build's source lint rejects anything else, naming file and line. Fix the page,
    never the lint.

  ### II. The Built Site Is the Contract
  The site's behaviour is what the build produces and what its checks assert: the source lint,
  front-matter validation, the page-set, link, stray-file and supply-chain checks, and the
  browser QA (screenshots, accessibility and search smoke tests). A prose spec would be a copy
  no gate keeps honest, so this OpenSpec workspace deliberately has no specs artifact.
  - There is no `openspec/specs/` directory and no delta specs. Every change's `.openspec.yaml`
    carries `skip_specs: true`; the `openspec-new-change` and `openspec-propose` skills write
    it at creation time. Never create a `specs/` directory inside a change.
  - The proposal's **Before / After** block (the config keys or the directory tree) is where
    the intended result is reviewed before code exists. Write it as config or a tree, not
    prose.
  - Behaviour worth keeping gets a check with a failing fixture, not a sentence in a document.
  - A decision a FUTURE maintainer or page author needs lands in `AGENTS.md`,
    `CONSTITUTION.md`, `README.md` or a contributor note before the change is archived.
    `design.md`'s **Durable decisions** section is where each change declares what it
    promotes. An archived change is never the only home of a rule.

  ### III. Generated Before Handwritten
  Reference pages are generated by `docgen` from their source (the CUE schema, the cobra
  command tree) and never hand-edited. Generated and authored content never share a file;
  generated output is gitignored or clearly marked. A doc bug that traces to source is fixed
  upstream, not in the generated output.

  ### IV. Pinned, Vendored, Built in Docker
  - Hextra is vendored into the repo as files, with the upstream commit and its licence
    recorded next to it. It is not a Hugo module and is never fetched at build time. Every
    upstream file the site overrides is hash-guarded, so an upstream change fails the build
    until someone diffs it; never re-pin only to turn a build green.
  - Hugo, Pagefind and every other build or QA tool are pinned by version and checksum or
    digest in the Docker images. Never float a version.
  - The site builds, serves and is tested only inside the Docker images the Taskfile defines.
    Never run `hugo`, `npm`, `npx` or `node` on the host, and never commit `node_modules/`.
    Builds run without network access; theme features that load code from a CDN stay off.
  - Source repos are mounted read-only into the build; the build never writes to them.

  ### V. Simplicity & YAGNI
  Start simple. Complexity MUST be justified with a clear rationale.
  - A new layout override, shortcode, check, build step or Taskfile target must solve a real
    documentation problem that a simpler approach cannot.
  - Prefer explicit configuration over implicit convention, and fewer layouts over many
    specialised templates.

  ### VI. Mergeable Sections (Iterative & Incremental Delivery)
  A change is delivered as the sections of its `tasks.md` (`## N. Title` headings with `N.M`
  checkboxes). Two invariants hold at every section boundary; they replace any size limit on
  the change itself.
  - **Every merge leaves `main` releasable.** A section MUST end green under the validation
    gates and MUST close with a commit task naming the Conventional Commit it lands as
    (§ Commit Standards below). Nothing that would break `main` is carried across a section boundary.
  - **Work survives a session boundary.** The commit task is the pause point: a session that
    stops there leaves checked boxes and a clean tree, and the next session resumes by running
    apply again.
  - One PR per change, one commit per section, is the default. Section 1 is a spike whenever
    design.md carries an unverified assumption.
  - **WARNING & BLOCK**: when a request cannot be cut into sections that each satisfy both
    invariants, or needs more than about five, the Agent MUST warn, block, and propose a split
    into sequential changes (Execution Gate).

  ## Execution Gate (Agent Directive)
  Before beginning ANY implementation, the Agent MUST evaluate the request against the
  "Mergeable Sections" principle. Block only when the request cannot be cut into sections that
  each end green and leave `main` releasable, or when it needs more than about five such
  sections. In that case the Agent MUST reply with:
  "🛑 **Scope Warning**: This request does not cut into a handful of mergeable sections. I
  suggest we split it into the following changes: [list 2-3 changes, each a few sections that
  leave main releasable]. Should we start with the first?"

  ## Site Versions
  - Every published version lives in its own URL subdirectory.
  - How the documentation is versioned against component releases is 0021:OQ15, an open
    question in the enhancements repo. A change names the versions it affects and may cite
    0021:OQ15, but never settles it by implication; the answer comes from the enhancements repo.

  ## Validation Gates (before merge)
  1. `task check` — docgen's Go code is formatted, vetted and tested, and `task openspec:check`
     (`openspec validate --all --strict --no-interactive`) is green.
  2. `task build` — the full site build in Docker, with its checks, succeeds.
  3. `task test:site` — every build check still fails on its fixture.
  4. `task qa` — screenshots (light, dark, phone width) plus the accessibility and search smoke
     tests. Required whenever anything visual changes; read the screenshots.

  ## Comments and Enhancement References
  - Default to no enhancement reference: say what the code does and why, in the comment's own words.
  - When the rationale genuinely lives in an enhancement, cite it once at the symbol as `0021:D4` — enhancement id, colon, decision id, no space. One enhancement, several decisions: `0021:D4/D9`. Across enhancements: `0021:D8, 0010:D34`. One requirement of a decision: `0021:D7:R1`; several: `0021:D7:R1/R2`. An open question: `0021:OQ15`. A bare `D14` names nothing, because decision numbers restart per enhancement.
  - Never cite a section, slice, phase, task or design-doc-local id (`§8.1`, `slice C2`, `task 4.2`, `design LD3`). They are not stable identifiers; a requirement number (`R2`) is.
  - Never put a reference in text the site publishes (page output, a layout's markup, `llms.txt`), a generated file, or a fixture a reader copies. Those reach people with no access to the enhancements repo.
  - No `Was:` rename history in comments; `git log` owns it.

  ## Commit Standards
  - Format: type(scope): description
  - Types: feat, fix, refactor, docs, test, chore, build, ci
  - Scope: site, docgen, openspec; a workflow-only change may be a bare `ci:`
  - Keep descriptions concise
  - Commits may end with the plain `Co-Authored-By: Claude <noreply@anthropic.com>` trailer (optional); never a session ID/URL or generated-with footer
  - Never a bare `@name` in a commit message, PR title or PR body (AGENTS.md); PR bodies stay under 250 words

rules:
  # Every entry in a rules list MUST be a plain string. OpenSpec 1.3.1 drops
  # the WHOLE artifact's rules with `Rules for 'design' must be an array of
  # strings, ignoring this artifact's rules` if any entry is a mapping — so
  # the familiar `- Format: |` block silently disables every rule beside it.
  # Keep multi-line entries as block scalars, never as `Key: value` mappings.
  proposal:
    - "Focus: WHY we're doing this, WHAT's in/out of scope"
    - "Updates when: Scope changes, intent clarifies, approach fundamentally shifts"
    - Name every source repo whose `docs/site` pages, front matter or links the change forces
      to change, and what each has to do (a follow-up in that repo, never an edit here;
      Principle I).
    - Name the published URLs and site versions the change affects. Documentation versioning
      is 0021:OQ15, an open question; a proposal may cite it but never claims to settle it.
    - The Before / After section MUST show the config keys or the directory tree, not a prose
      description (Principle II). "none" is the Before of something new.
    - Complexity additions MUST include justification (Principle V).
    - Scope MUST cut into at most about five tasks.md sections, each ending green and leaving
      `main` releasable on its own (Principle VI).
    - "Delivery mode: one PR per change is the default and needs no statement. When a downstream
      consumer must pick up a published pin mid-change, add exactly one line to the proposal,
      `Delivery: one PR per section (<consumer> needs <pin> after section <N>)`, and the change
      ships section by section. In that mode the change stays active on main between PRs, and
      enhancement delivery logging waits for archive after the last PR."
    - "Never add a Capabilities section and never create a `specs/` directory; the change's `.openspec.yaml` MUST carry `skip_specs: true` (Principle II)."
    - When the change implements a slice of an enhancement, cite the entry and the decision
      numbers it satisfies (`0021:D8`) or, when only part of a decision lands, the requirement
      numbers (`0021:D7:R1`) rather than restating the design.
    - "If this change implements decisions from an enhancement in the sibling enhancements/ repo, create enhancement.yaml in this change directory declaring it (implements: [{enhancement: \"NNNN\", decisions: [D1, ...], resolves: []}]). Write it at creation time, while the enhancement is in context; it is what makes archive-time delivery logging mechanical."

  design:
    - "Focus: HOW we'll implement it technically"
    - "Updates when: Implementation reveals better approach, constraints change"
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - MUST include a "Research & Decisions" section when exploration was done.
    - |
      Format for that section:

      ## Research & Decisions

      ### [Topic]
      **Context**: [Why this decision was needed]
      **Explored**: [What was investigated - link to exploration notes]
      **Decision**: [Chosen option]
      **Rationale**: [Why this option was selected]
    - Show the config, the tree or the template, not a description of it.
    - Name every file under `site/` the change touches, and whether the build gains or loses
      an input (a mount, a source repo, a vendored file, a pinned tool).
    - Call out any change to published URLs, the version set, or the set of theme files the
      site overrides; these break readers or the drift guard in ways an added page does not.
    - MUST include a "Durable decisions" section listing every decision a future maintainer or
      page author needs and where it lands at archive (`AGENTS.md`, `CONSTITUTION.md`,
      `README.md`, a contributor note, or "stays with the change"). Write "None." when empty;
      never omit the section.

  tasks:
    - "Focus: STEPS to take for implementation"
    - "Updates when: Tasks complete, new tasks discovered, blockers identified"
    - "CRITICAL: Every `## N.` section MUST end green under the validation gates and MUST close
      with a commit task: an ordinary `- [ ] N.M` checkbox whose text names the Conventional
      Commit to make, e.g. `- [ ] 1.4 task check and task build green, then commit feat(site): add the version switch`
      (types and scopes per § Commit Standards). The commit task is the pause point; nothing uncommitted is carried across
      a section boundary."
    - "CRITICAL: Cut the change into at most about seven sections, each a coherent unit that
      leaves main releasable by itself. If it needs more, or a section cannot end green on its
      own, split into a new OpenSpec change. Section 1 is a spike whenever design.md carries an
      unverified assumption; its commit task lands what the spike produced (a test, a fixture,
      or the finding written into design.md)."
    - Every verification task names an observable check (a built page, a screenshot that was
      read, a check script's result), run in Docker.
    - Group tasks by area (site config, layouts and overrides, build scripts and checks,
      Taskfile and images, docgen, CI).
    - Include one task per durable decision in design.md that lands it in its target file.
    - Include the validation gates (`task check`, the site build gate, and `task qa` when
      anything visual changes) in every section's commit task, not as a trailing section.
    - "The section-closing commit is the ONLY delivery operation allowed in tasks.md: no pushing,
      branching, opening or merging PRs, tagging, cutting releases, and no commit-message or
      PR-body hygiene checks. Everything past the commit happens under the repo's normal git
      workflow (one PR per change by default; one PR per section only when the proposal says
      so). Sole exception: a change whose stated deliverable is itself a release or publishing
      operation; there those steps ARE the implementation."

# Operation hooks: served to the agent by `openspec instructions apply|archive --change <name>
# --json` as operationGuidance.
operations:
  apply:
    guidance:
      - "Work section by section: every `## N.` block of tasks.md ends with a commit task. Before
        checking that box, run the section's gates (`task check` plus the build gates tasks.md
        names) on the whole tree and make exactly the named Conventional Commit (types and scopes
        per § Commit Standards; optional plain Co-Authored-By: Claude <noreply@anthropic.com>
        trailer only, never a session link, never a bare @name, and no body line starting with
        word( because a squash body line in that shape parses as a commit). Do not start the
        next section with uncommitted work in the tree."
      - "The commit task is the only delivery operation apply performs: no push, no PR, no tag,
        no release. Commit on the working branch the run started on. If the run started on
        main, create the working branch before the first commit task; never commit to main."
      - "Build, serve and test the site only through the Taskfile's Docker tasks. Never run hugo,
        npm, npx or node on the host; never stop, restart or rebind a running container; never
        retag or prune an image another checkout may be using."
      - "Pausing: when the user asks to pause, or a blocker appears, finish the current section's
        commit task first if its gates are green; otherwise report exactly which boxes are
        checked and what is uncommitted in the tree. A new session resumes by running apply
        again: the checked boxes plus a clean tree are the resume state."
      - "Delivery mode: unless proposal.md carries `Delivery: one PR per section`, all section
        commits ship in one PR after the last section. In per-section mode the change stays
        active on main between PRs, and enhancement delivery logging waits for archive after
        the last PR."
  archive:
    guidance:
      - "Archive with `--skip-specs`: this workspace has no specs and the change declares skip_specs. Never let archive create an openspec/specs/ directory."
      - "Before archiving, read design.md's Durable decisions section. Every entry marked for promotion MUST already be landed in its target file (AGENTS.md, CONSTITUTION.md, README.md or a contributor note); if one is not, stop and land it first. An archived change must not be the only home of a rule."
      - "If this change directory contains enhancement.yaml, finish the archive by logging the landing: from the workspace root run `task enhancements:delivery:log FROM=<archived-change-path> SUMMARY=\"<one line: what landed>\"`. It appends a CUE-validated entry to each declared enhancement's delivery.yaml; confirm it printed 'logged' for every declared enhancement."
